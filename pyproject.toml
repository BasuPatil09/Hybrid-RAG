[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Hybrid (dense + sparse) RAG system with verified inline citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "slowapi>=0.1.10,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "chromadb>=1.5.9,<2.0",
    "rank-bm25>=0.2.2",
    "langchain-text-splitters>=1.1.2,<2.0",
    "beautifulsoup4>=4.14",
    "lxml>=6.0",
    "pypdf>=5.9",
    "groq>=1.6,<2.0",
    "httpx>=0.28",
    "numpy>=1.26",
    "sentence-transformers>=5.6,<6.0",  # cross-encoder reranker (Phase 2) + local embeddings
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "reportlab>=4.2",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]